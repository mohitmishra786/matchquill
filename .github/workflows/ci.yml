name: CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-test:
    name: Backend (Test & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libgobject-2.0-0 libglib2.0-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Linting (Ruff)
      run: |
        ruff check .

    # Prefer repository secrets; when unavailable (Dependabot/forks), emit
    # ephemeral non-production values so unit tests can import Settings.
    - name: Prepare backend test environment
      env:
        SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        SECRET_REDIS_URL: ${{ secrets.UPSTASH_REDIS_RES_REDIS_URL }}
        SECRET_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        SECRET_NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        UPSTASH_REDIS_RES_KV_REST_API_TOKEN: ${{ secrets.UPSTASH_REDIS_RES_KV_REST_API_TOKEN }}
        UPSTASH_REDIS_RES_KV_REST_API_URL: ${{ secrets.UPSTASH_REDIS_RES_KV_REST_API_URL }}
        UPSTASH_REDIS_RES_KV_URL: ${{ secrets.UPSTASH_REDIS_RES_KV_URL }}
        UPSTASH_REDIS_RES_REDIS_URL: ${{ secrets.UPSTASH_REDIS_RES_REDIS_URL }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        EPHEMERAL_SUFFIX="$(openssl rand -hex 8)"
        {
          if [ -n "${SECRET_DATABASE_URL:-}" ]; then
            echo "DATABASE_URL=${SECRET_DATABASE_URL}"
          else
            echo "DATABASE_URL=postgresql://ci_user:ci_pass@127.0.0.1:5432/matchquill_${EPHEMERAL_SUFFIX}"
          fi
          if [ -n "${SECRET_REDIS_URL:-}" ]; then
            echo "REDIS_URL=${SECRET_REDIS_URL}"
          else
            echo "REDIS_URL=redis://127.0.0.1:6379/${EPHEMERAL_SUFFIX}"
          fi
          if [ -n "${SECRET_GROQ_API_KEY:-}" ]; then
            echo "GROQ_API_KEY=${SECRET_GROQ_API_KEY}"
          else
            echo "GROQ_API_KEY=ci_groq_${EPHEMERAL_SUFFIX}"
          fi
          if [ -n "${SECRET_NEXTAUTH_SECRET:-}" ]; then
            echo "NEXTAUTH_SECRET=${SECRET_NEXTAUTH_SECRET}"
          else
            echo "NEXTAUTH_SECRET=ci_auth_${EPHEMERAL_SUFFIX}"
          fi
          echo "NEXTAUTH_URL=http://localhost:3000"
          echo "FRONTEND_URL=http://localhost:3000"
          # Pass through optional secrets only when present
          [ -n "${UPSTASH_REDIS_RES_KV_REST_API_TOKEN:-}" ] && echo "UPSTASH_REDIS_RES_KV_REST_API_TOKEN=${UPSTASH_REDIS_RES_KV_REST_API_TOKEN}"
          [ -n "${UPSTASH_REDIS_RES_KV_REST_API_URL:-}" ] && echo "UPSTASH_REDIS_RES_KV_REST_API_URL=${UPSTASH_REDIS_RES_KV_REST_API_URL}"
          [ -n "${UPSTASH_REDIS_RES_KV_URL:-}" ] && echo "UPSTASH_REDIS_RES_KV_URL=${UPSTASH_REDIS_RES_KV_URL}"
          [ -n "${UPSTASH_REDIS_RES_REDIS_URL:-}" ] && echo "UPSTASH_REDIS_RES_REDIS_URL=${UPSTASH_REDIS_RES_REDIS_URL}"
          [ -n "${GOOGLE_CLIENT_ID:-}" ] && echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}"
          [ -n "${GOOGLE_CLIENT_SECRET:-}" ] && echo "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}"
        } >> "$GITHUB_ENV"

    - name: Run Tests
      run: |
        PYTHONPATH=. pytest

  frontend-test:
    name: Frontend (Build & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Prepare frontend build environment
      env:
        SECRET_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        SECRET_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        set -euo pipefail
        EPHEMERAL_SUFFIX="$(openssl rand -hex 8)"
        {
          if [ -n "${SECRET_DATABASE_URL:-}" ]; then
            echo "DATABASE_URL=${SECRET_DATABASE_URL}"
          else
            echo "DATABASE_URL=postgresql://ci_user:ci_pass@127.0.0.1:5432/matchquill_${EPHEMERAL_SUFFIX}"
          fi
          if [ -n "${SECRET_GROQ_API_KEY:-}" ]; then
            echo "GROQ_API_KEY=${SECRET_GROQ_API_KEY}"
          else
            echo "GROQ_API_KEY=ci_groq_${EPHEMERAL_SUFFIX}"
          fi
        } >> "$GITHUB_ENV"

    - name: Build
      run: npm run build

    - name: Run Tests
      # Invoke vitest directly rather than through the "test" npm script so
      # this step can't be silently neutered again by swapping the script
      # for a no-op (as happened previously - see frontend/vitest.config.mts
      # and the "test" script in package.json).
      run: npx vitest run

  extension-test:
    name: Extension (Tests)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: extension/package-lock.json

    - name: Install Extension dependencies
      working-directory: ./extension
      run: npm ci

    - name: Run Extension Tests
      working-directory: ./extension
      run: node tests/run_tests.js
